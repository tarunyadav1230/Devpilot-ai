services:
  # 1. FastAPI Backend Service (100% Free Plan)
  - type: web
    name: devpilot-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /docs
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: devpilot-redis
          property: connectionString
      - key: PORT
        value: 7860
      - key: LANGSMITH_TRACING
        value: "false"

  # 2. React Frontend Static Site (100% Free Plan)
  - type: web
    name: devpilot-frontend
    env: static
    buildCommand: cd ui && npm install && npm run build
    staticPublishPath: ui/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. Redis Cache & Broker (100% Free Plan)
  - type: keyvalue
    name: devpilot-redis
    region: oregon
    plan: free
    ipAllowList: []
